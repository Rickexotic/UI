<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Hub</title>

    ./css/style.css
</head>

<body>

    <div class="theme-toggle">

        <label class="switch">

            <input type="checkbox" id="theme-switch">

            <span class="slider"></span>

        </label>

    </div>

    <div class="hero">

        <div class="dashboard-grid">

            <div class="glass-card">
                <div class="icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="icon" viewBox="0 0 16 16">
                        <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492"/>
                        <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52z"/>
                    </svg>
                </div>
                <h2 class="card-title">Settings</h2>
            </div>

            <div class="glass-card">
                <div class="icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="icon" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 0 8 1z"/>
                    </svg>
                </div>
                <h2 class="card-title">Theme</h2>
            </div>

            <div class="glass-card">
                <div class="icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="icon" viewBox="0 0 16 16">
                        <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h4"/>
                        <path d="M12.5 10.5v4m-2-2h4"/>
                    </svg>
                </div>
                <h2 class="card-title">Add Site</h2>
            </div>

            <div class="glass-card">
                <div class="icon-wrapper">🏘</div>
                <h2 class="card-title">Sites</h2>
            </div>

            <div class="glass-card">
                <div class="icon-wrapper">👤+</div>
                <h2 class="card-title">Add User</h2>
            </div>

            <div class="glass-card">
                <div class="icon-wrapper">👥</div>
                <h2 class="card-title">Users</h2>
            </div>

            <div class="glass-card">
                <div class="icon-wrapper">⚙️</div>
                <h2 class="card-title">Profiles</h2>
            </div>

            <div class="glass-card">
                <div class="icon-wrapper">🕸</div>
                <h2 class="card-title">Structure</h2>
            </div>

        </div>

    </div>

    <script>

        const switcher =
            document.getElementById('theme-switch');

        switcher.addEventListener('change', () => {

            document.body.classList.toggle('light-mode');

        });

    </script>

</body>

</html>
